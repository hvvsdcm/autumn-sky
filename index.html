<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가을 밤하늘</title>
  <meta name="description" content="밤하늘을 클릭하면 별똥별이 떨어지고 소원 한 줄이 떠오릅니다.">
  <style>
    :root {
      --sky-top: #0b1026;
      --sky-bottom: #2b1b3d;
      --text: #f4ecdf;
      --muted: #b9adc9;
      --accent: #ffcf7a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
    }
    canvas { position: fixed; inset: 0; }
    header {
      position: fixed; top: 12vh; left: 0; right: 0;
      text-align: center; padding: 0 16px; pointer-events: none;
    }
    h1 { font-size: clamp(2rem, 7vw, 3.6rem); font-weight: 700; letter-spacing: -0.02em; }
    header p { margin-top: 0.6rem; color: var(--muted); font-size: clamp(0.95rem, 3vw, 1.1rem); }
    #wish {
      position: fixed; left: 0; right: 0; bottom: 18vh;
      text-align: center; padding: 0 16px;
      font-size: clamp(1.1rem, 4vw, 1.5rem); color: var(--accent);
      opacity: 0; transition: opacity 0.8s ease; pointer-events: none;
    }
    #wish.show { opacity: 1; }
    footer {
      position: fixed; bottom: 16px; left: 0; right: 0;
      text-align: center; font-size: 0.85rem; color: var(--muted); pointer-events: none;
    }
    .hills {
      position: fixed; left: 0; right: 0; bottom: 0; height: 14vh;
      background: #120b1c;
      clip-path: polygon(0 60%, 12% 35%, 25% 55%, 40% 25%, 55% 50%, 70% 30%, 85% 55%, 100% 35%, 100% 100%, 0 100%);
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="hills"></div>
  <header>
    <h1>가을 밤하늘</h1>
    <p>하늘 아무 곳이나 눌러 별똥별을 띄워 보세요</p>
  </header>
  <div id="wish" aria-live="polite"></div>
  <footer>별똥별 <span id="count">0</span>개</footer>

  <script>
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    const wishEl = document.getElementById('wish');
    const countEl = document.getElementById('count');

    const wishes = [
      '내일은 오늘보다 조금 더 따뜻하길',
      '좋아하는 사람과 붕어빵 나눠 먹기',
      '이번 주말엔 늦잠을 자게 해주세요',
      '배포가 한 번에 성공하길',
      '단풍 구경 가는 날 날씨가 맑기를',
      '보고 싶은 사람에게 연락이 오길',
      '버그 없는 금요일',
      '따뜻한 차 한 잔의 여유',
    ];

    let stars = [];
    let meteors = [];
    let count = 0;
    let wishTimer;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(innerWidth * innerHeight / 3500);
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight * 0.9,
        r: Math.random() * 1.3 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.005,
      }));
    }

    function launch(x, y) {
      const angle = Math.PI * (0.7 + Math.random() * 0.15);
      meteors.push({ x, y, vx: Math.cos(angle) * 9, vy: Math.sin(angle) * 9, life: 1 });
      count++;
      countEl.textContent = count;
      wishEl.textContent = '✦ ' + wishes[Math.floor(Math.random() * wishes.length)];
      wishEl.classList.add('show');
      clearTimeout(wishTimer);
      wishTimer = setTimeout(() => wishEl.classList.remove('show'), 2600);
    }

    canvas.addEventListener('pointerdown', e => launch(e.clientX, e.clientY));

    function frame() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      for (const s of stars) {
        s.phase += s.speed;
        ctx.globalAlpha = 0.5 + Math.sin(s.phase) * 0.5;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      for (const m of meteors) {
        const tail = 14;
        const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * tail, m.y - m.vy * tail);
        grad.addColorStop(0, `rgba(255, 220, 150, ${m.life})`);
        grad.addColorStop(1, 'rgba(255, 220, 150, 0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * tail, m.y - m.vy * tail);
        ctx.stroke();
        m.x += m.vx;
        m.y += m.vy;
        m.life -= 0.012;
      }
      meteors = meteors.filter(m => m.life > 0);

      if (Math.random() < 0.004) {
        meteors.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight * 0.3, vx: -7, vy: 5, life: 0.7 });
      }

      requestAnimationFrame(frame);
    }

    addEventListener('resize', resize);
    resize();
    frame();
  </script>
</body>
</html>
